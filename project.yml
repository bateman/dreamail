name: DreaMail
options:
  bundleIdPrefix: io.github.bateman
  deploymentTarget:
    macOS: "14.0"
# Compiler warnings fail the CI build of DreaMail's own targets: app,
# relauncher and unit tests (the UI-test target is not gated: CI does not
# pass the flag to `make ui-test`). Routed through a variable that only CI
# sets (`make build WARNINGS_AS_ERRORS=1`, see the Makefile) so local builds
# and the Release builds of `make install` and `make release` are
# unaffected. Project-level on purpose:
# Swift package targets (GRDB/SQLCipher) are built in their own projects and
# never see these settings, whereas a command-line
# SWIFT_TREAT_WARNINGS_AS_ERRORS=YES would reach them too.
settings:
  base:
    DREAMAIL_WARNINGS_AS_ERRORS: NO
    SWIFT_TREAT_WARNINGS_AS_ERRORS: $(DREAMAIL_WARNINGS_AS_ERRORS)
    GCC_TREAT_WARNINGS_AS_ERRORS: $(DREAMAIL_WARNINGS_AS_ERRORS)
packages:
  # DuckDuckGo's GRDB build with SQLCipher, shipped as a prebuilt binary.
  # Package tag 3.0.0 (GRDB 7.4.1, SQLCipher 4.7.0), pinned by commit because
  # a tag can be moved; CI rejects any other form. Provenance and how to
  # upgrade: docs/DEPENDENCIES.md.
  GRDB:
    url: https://github.com/duckduckgo/GRDB.swift
    revision: 46098847eeabdb008f238bef5750a8e64097b6ed
  # The OpenPGP engine (rPGP behind a C interface, step 4B) as a prebuilt,
  # checksummed static xcframework. Release v0.2.0, pinned by the commit that
  # sets that version and its checksum in Package.swift; SwiftPM refuses a
  # downloaded zip with another SHA-256. Linked always; called only when the
  # build turns OpenPGP on (the build switch, see PGPFeatures).
  DreaMailRPGP:
    url: https://github.com/bateman/dreamail-openpgp
    revision: b87eb51e7a4faf34c0f5d868342c1de772d49ac9
targets:
  DreaMail:
    type: application
    platform: macOS
    sources:
      - Sources/DreaMail
      # The app↔relauncher contract (plan file paths and format); compiled
      # into both targets so the two sides can never skew.
      - Sources/DreaMailRelauncher/Relaunch.swift
    dependencies:
      - package: GRDB
      - package: DreaMailRPGP
      # Embedded at Contents/Library/DreaMailRelauncher.app and signed on copy.
      - target: DreaMailRelauncher
        embed: true
        codeSign: true
        copy:
          destination: wrapper
          subpath: Contents/Library
    # The app's entitlements are hand-maintained plists (the rationale for
    # each key lives as comments inside them), selected per build through
    # DREAMAIL_APP_ENTITLEMENTS below — NOT through an `entitlements:` block
    # here, because that block's generated CODE_SIGN_ENTITLEMENTS overrides
    # the variable-driven one in settings.
    #   Sources/DreaMail/DreaMail.entitlements               — dev default
    #   Sources/DreaMail/DreaMail.Distribution.entitlements  — install/release
    # Signing lives in Config/Signing.xcconfig (portable ad-hoc default; drop a
    # Config/Local.xcconfig to sign with your own team). Keep it out of the
    # per-target settings so the xcconfig actually wins.
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    settings:
      base:
        # Which entitlements file signs the APP — routed through a variable so
        # the Makefile can switch install/release builds to the Distribution
        # entitlements without putting CODE_SIGN_ENTITLEMENTS on the xcodebuild
        # command line. A command-line setting applies to EVERY target, which
        # is how the relauncher shipped sandboxed in 0.4.3–0.4.5 and silently
        # lost the ability to strip quarantine (its whole job).
        DREAMAIL_APP_ENTITLEMENTS: Sources/DreaMail/DreaMail.entitlements
        CODE_SIGN_ENTITLEMENTS: $(DREAMAIL_APP_ENTITLEMENTS)
        # Objective-C helpers (exception-safe TextKit calls) for Swift.
        SWIFT_OBJC_BRIDGING_HEADER: Sources/DreaMail/Support/DreaMail-Bridging-Header.h
        MARKETING_VERSION: 0.7.0
        CURRENT_PROJECT_VERSION: 7
        SWIFT_VERSION: 5.10
        GENERATE_INFOPLIST_FILE: true
        # Merged with generated keys: registers mailto: for default email app.
        INFOPLIST_FILE: Sources/DreaMail/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        ENABLE_HARDENED_RUNTIME: true
        # Drop unreferenced functions and data at link time: a smaller binary
        # maps and pages in less at launch. Xcode's modern project template
        # enables it; xcodegen's defaults do not.
        DEAD_CODE_STRIPPING: YES
        # GRDB ships sqlite3.h next to its umbrella without listing it there;
        # clang emits -Wincomplete-umbrella for that. Harmless third-party
        # noise. The warning fires in the Clang importer during the *Swift*
        # compile, so it must be silenced via -Xcc — OTHER_CFLAGS alone
        # doesn't reach it.
        OTHER_CFLAGS: "$(inherited) -Wno-incomplete-umbrella"
        OTHER_SWIFT_FLAGS: "$(inherited) -Xcc -Wno-incomplete-umbrella"
      # Debug and Release build two DISTINCT apps so a throwaway test build is
      # never confused with — or able to corrupt — the real one you use daily:
      #   Release  → "DreaMail",       io.github.bateman.DreaMail        (make install → /Applications)
      #   Debug    → "DreaMail Debug", io.github.bateman.DreaMail.debug  (make run, launched in place)
      # The different bundle id gives Debug its own sandbox container + keychain,
      # so it syncs into a separate local database (sign in once; tokens persist
      # across rebuilds) and can't touch the real app's data. They coexist.
      configs:
        Debug:
          PRODUCT_NAME: DreaMail Debug
          PRODUCT_BUNDLE_IDENTIFIER: io.github.bateman.DreaMail.debug
          INFOPLIST_KEY_CFBundleDisplayName: DreaMail Debug
        Release:
          PRODUCT_NAME: DreaMail
          PRODUCT_BUNDLE_IDENTIFIER: io.github.bateman.DreaMail
  # A second, deliberately tiny app whose whole job is to reopen DreaMail after
  # it quits. It exists because a sandboxed app cannot restart itself: asking
  # LaunchServices for a second instance of the bundle you are running from
  # fails (-10810, seen updating 0.4.1 → 0.4.2), and the sandbox blocks
  # spawning a shell to do it instead (0.4.2 → 0.4.3). A separate bundle id
  # clears both — launching *another* app is permitted, and by the time this
  # one acts DreaMail is gone, so there is nothing to conflict with.
  # LSUIElement: no Dock icon, no menu bar, nothing on screen.
  DreaMailRelauncher:
    type: application
    platform: macOS
    sources: [Sources/DreaMailRelauncher]
    # The same signing config as the app it lives inside — an embedded bundle
    # signed with a different certificate than its parent fails the build, and
    # this has to stay matched across all three tiers (ad-hoc default, free
    # Personal Team via Local.xcconfig, Developer ID).
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    settings:
      base:
        # NOT the app's entitlements, and above all NOT sandboxed. The helper
        # must remove com.apple.quarantine from the installed update — the
        # sandbox denies that removal (EPERM), and a quarantined un-notarized
        # bundle won't launch at all (-10810). make install / make release
        # verify this after building; see the entitlements file itself for the
        # full story.
        CODE_SIGN_ENTITLEMENTS: Sources/DreaMailRelauncher/DreaMailRelauncher.entitlements
        PRODUCT_NAME: DreaMailRelauncher
        PRODUCT_BUNDLE_IDENTIFIER: io.github.bateman.DreaMail.Relauncher
        # No MARKETING_VERSION here on purpose: nothing reads the helper's
        # version, and a second one in this file is what the Makefile's
        # version lookup would trip over.
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: 5.10
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_KEY_LSUIElement: true
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        ENABLE_HARDENED_RUNTIME: true
        DEAD_CODE_STRIPPING: YES
        SKIP_INSTALL: true
  # Standalone unit tests over the non-UI core (parsers, MIME, DB schema,
  # sync derivation). Compiles those sources by directory — no app host, so no
  # keychain prompts, no network, no real database. New Gmail/Store/Auth/Support
  # files are picked up automatically; only app-only files need an exclude.
  # Longer term this set becomes a Swift package both targets import.
  DreaMailTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/DreaMailTests
      # The relauncher's quarantine stripping, testable here because the test
      # runner is unsandboxed — the same reason the strip lives in the helper.
      - Sources/DreaMailRelauncher/Quarantine.swift
      - Sources/DreaMailRelauncher/Relaunch.swift
      - path: Sources/DreaMail/Gmail
      - path: Sources/DreaMail/Store
      - path: Sources/DreaMail/Auth
      - path: Sources/DreaMail/Calendar
      # OpenPGP groundwork (step 4B): structure, rules and the engine seam.
      - path: Sources/DreaMail/PGP
      - path: Sources/DreaMail/MCP
        excludes:
          # MailStore-backed bridge + NWListener stay app-only.
          - MCPBridge.swift
          - MCPServer.swift
      - path: Sources/DreaMail/Support
        excludes:
          # MailStore / SwiftUI-environment — app target only. The WebKit
          # pool and HTMLBodyView are compiled here so tests drive the real
          # body coordinator.
          - AskAIController.swift
          - GmailFilterDisplay.swift
          - HTMLBodyPrerender.swift
          - QuickLookController.swift
          - Styles.swift
          - UITestBreadcrumbs.swift
    dependencies:
      - package: GRDB
      # The real library, so the bindings and a round trip are tested.
      - package: DreaMailRPGP
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    settings:
      base:
        SWIFT_VERSION: 5.10
        GENERATE_INFOPLIST_FILE: true
        # Support/ is compiled into this bundle too; it needs the same header.
        SWIFT_OBJC_BRIDGING_HEADER: Sources/DreaMail/Support/DreaMail-Bridging-Header.h
        # Same GRDB incomplete-umbrella noise as the app target.
        OTHER_CFLAGS: "$(inherited) -Wno-incomplete-umbrella"
        OTHER_SWIFT_FLAGS: "$(inherited) -Xcc -Wno-incomplete-umbrella"
  DreaMailUITests:
    type: bundle.ui-testing
    platform: macOS
    sources: [Tests/DreaMailUITests]
    dependencies:
      - target: DreaMail
    settings:
      base:
        SWIFT_VERSION: 5.10
        GENERATE_INFOPLIST_FILE: true
schemes:
  DreaMail:
    build:
      targets:
        DreaMail: all
    run:
      config: Debug
    archive:
      config: Release
  DreaMailTests:
    build:
      targets:
        DreaMailTests: [test]
    test:
      config: Debug
      targets:
        - DreaMailTests
  DreaMailUITests:
    build:
      targets:
        DreaMail: all
        DreaMailUITests: [test]
    test:
      config: Debug
      targets:
        - DreaMailUITests
