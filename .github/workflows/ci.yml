name: CI

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

# Least privilege: every job gets a read-only GITHUB_TOKEN. A job that needs
# more raises it in its own `permissions:` block. The cache actions use the
# runner's cache token, not GITHUB_TOKEN, so they need nothing here.
permissions:
  contents: read

# A new push to a pull request cancels the run it replaces. On main, runs
# for different commits never cancel each other: each push run decides from
# its own commits whether to build (see the `changes` job), so a cancelled
# run would leave its commits untested. Two runs for the same main commit
# (a push and a manual run) still collapse into the later one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: true

jobs:
  workflow-hardening:
    name: Workflow hardening
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Every action pinned to a full commit SHA, a read-only top-level
      # permissions block, no unpinned `brew install` (finding F-10).
      - name: Check workflow pinning and token scope
        run: python3 .github/scripts/check-workflows.py

      # Swift packages pinned by full commit SHA in project.yml: a version or
      # branch rule would let a moved tag change what is built.
      - name: Check Swift package pins
        run: python3 .github/scripts/check-package-pins.py

      # The CI checks' own tests, and the MCP helpers' endpoint rules
      # (finding F-05) with a throwaway HOME. The macOS job runs the latter
      # too, inside ScriptEndpointTests.swift; here they fail in a minute and
      # without a build. One definition, in the Makefile, for CI and local.
      - name: Test the CI checks and the helper scripts
        run: make script-tests

      # Every tracked *.sh file; shellcheck comes with the runner image.
      - name: Shellcheck the shell scripts
        run: make shellcheck

  # Whether the macOS job below has anything to do: not when every changed
  # file is documentation that neither the build nor a test reads
  # (.github/scripts/needs-build.py has the list). A pull request into main
  # compares its merge commit with main; a push to main compares with the
  # commit main pointed at before the push. Any other run builds, a pull
  # request into another branch included: its skipped check would stay on
  # the head commit and could pass main's required check once the pull
  # request is retargeted to main, which does not start a new run.
  changes:
    name: Changed files
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      build: ${{ steps.decide.outputs.build }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history: a push can carry several commits.
          fetch-depth: 0

      - name: Decide whether to build and test
        id: decide
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.base_ref == 'main' && 'HEAD^1' || github.event_name == 'push' && github.event.before || '' }}
        run: python3 .github/scripts/needs-build.py "$BASE" >> "$GITHUB_OUTPUT"

  test:
    # A fixed name: GitHub does not evaluate the name of a skipped job.
    name: Unit tests & build
    needs: changes
    # A skipped job counts as passed for a required check. The job runs
    # unless `changes` positively found a docs-only change: if `changes`
    # failed, its output is empty and the tests run.
    if: ${{ !cancelled() && needs.changes.outputs.build != 'false' }}
    runs-on: macos-26
    # A cold build and test run takes about six minutes.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history: the build cache needs commit times (see below).
          fetch-depth: 0

      # A fixed, checksummed release; the log and job summary record it.
      - name: Install xcodegen
        run: bash .github/scripts/install-xcodegen.sh

      - name: Prepare the build cache
        id: cache-key
        run: |
          # A checkout stamps every file "now"; xcodebuild would then rebuild
          # everything over a restored cache. Use commit times instead.
          python3 scripts/ci-restore-mtimes.py
          # The cache comes from another runner: inodes never match.
          defaults write com.apple.dt.XCBuild IgnoreFileSystemDeviceInodeChanges -bool YES
          echo "xcode=$(xcodebuild -version | shasum | cut -c1-12)" >> "$GITHUB_OUTPUT"

      # DerivedData. Runs read the newest cache for this Xcode and project
      # file; only main writes one, the only branch whose cache every
      # pull request can read.
      - name: Restore the build cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/dd.noindex
          key: dd-${{ runner.os }}-${{ steps.cache-key.outputs.xcode }}-${{ hashFiles('project.yml') }}-${{ github.sha }}
          restore-keys: |
            dd-${{ runner.os }}-${{ steps.cache-key.outputs.xcode }}-${{ hashFiles('project.yml') }}-

      # SwiftPM checks a binary target's SHA-256 against the pinned manifest
      # only when it downloads the archive. Drop the restored package checkout
      # and artifacts so every run downloads GRDB again and SwiftPM verifies it.
      - name: Drop cached Swift packages
        run: |
          if [ -d build/dd.noindex/SourcePackages ]; then
            echo "Removing restored $(du -sh build/dd.noindex/SourcePackages | cut -f1) of Swift packages"
          fi
          rm -rf build/dd.noindex/SourcePackages

      # Build first: the unit suite has tests that inspect the built Debug
      # app (signature, zip round trip, embedded relauncher, ad-hoc trust).
      # With no app on disk they skip, so the old order never ran them.
      # WARNINGS_AS_ERRORS=1: a Swift or C/ObjC warning in DreaMail's own
      # targets fails the build (project.yml). Swift packages are exempt.
      # The cache is saved from builds with the same setting.
      - name: Build app
        run: make build WARNINGS_AS_ERRORS=1

      - name: Run unit tests
        run: |
          set -o pipefail
          make test WARNINGS_AS_ERRORS=1 2>&1 | tee "$RUNNER_TEMP/unit-tests.log"

      # A skipped test passes, so a missing app would pass the signature
      # tests silently. Only the runner-dependent skips in the allowlist pass.
      - name: Check that no test skipped unexpectedly
        run: python3 .github/scripts/check-test-skips.py "$RUNNER_TEMP/unit-tests.log"

      - name: Save the build cache
        if: github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/dd.noindex
          key: dd-${{ runner.os }}-${{ steps.cache-key.outputs.xcode }}-${{ hashFiles('project.yml') }}-${{ github.sha }}

  ui-test:
    # The suite in parallel shards, each on its own runner. The matrix is
    # the only place that sets how many: .github/scripts/ui-shards.py splits
    # the test classes by measured duration. `make release` and
    # `make ui-test-ci` wait for the whole run, so they need every shard.
    name: UI smoke tests (${{ matrix.shard }} of ${{ strategy.job-total }})
    # Not on every push or pull request. Runs when a release is published
    # and on a manual run; `make release` starts a manual run on main and
    # waits for it before it publishes, and `make ui-test-ci` starts one on
    # any pushed branch.
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    runs-on: macos-26
    strategy:
      # One shard failing must not cancel the others: every result counts.
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    # About twelve minutes each: a build of about four, then about eight of
    # tests (November 2026: two shards reached 20 minutes). The limit is
    # headroom for slow runners; a shard regularly over twelve minutes
    # wants another shard, not a higher limit.
    timeout-minutes: 25
    # Separate job so a UI hang or desktop hijack cannot hide unit-test results.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A fixed, checksummed release; the log and job summary record it.
      - name: Install xcodegen
        run: bash .github/scripts/install-xcodegen.sh

      - name: Run UI smoke test
        env:
          UI_SHARD: ${{ matrix.shard }}
          UI_SHARDS: ${{ strategy.job-total }}
        run: |
          set -o pipefail
          make ui-test 2>&1 | tee "$RUNNER_TEMP/ui-tests.log"

      # A class assigned to this shard that ran no test (for example a
      # class whose name -only-testing does not match) would pass silently.
      - name: Check that every class of this shard ran
        env:
          UI_SHARD: ${{ matrix.shard }}
          UI_SHARDS: ${{ strategy.job-total }}
        run: python3 .github/scripts/ui-shards.py check "$RUNNER_TEMP/ui-tests.log" "$UI_SHARD" "$UI_SHARDS"

      - name: Check that no UI test skipped unexpectedly
        run: python3 .github/scripts/check-test-skips.py "$RUNNER_TEMP/ui-tests.log"
