name: Integrate dreamail-openpgp

# Manual only: integrates a dreamail-openpgp release (the newest, or the
# version given) and checks that it introduces no regression.
#
#   1. The whole CI (a manual run, UI shards included) must be green on
#      main's head, reused if one already passed there, so that a failure
#      on the branch can only come from the new pin.
#   2. .github/scripts/integrate-openpgp.py picks the release, checks that
#      Package.swift, the release's .sha256 asset and the downloaded zip
#      agree, and edits project.yml, docs/DEPENDENCIES.md and CHANGELOG.md.
#   3. Branch deps/dreamail-openpgp-v<version> is pushed and the whole CI
#      workflow runs on it as a manual run: workflow hardening, package
#      pins, the build with warnings as errors, the unit tests (the
#      linked-library tests included), the test-skip check and both UI
#      shards.
#   4. CI green: the pull request is opened and squash-merged, then CI runs
#      on main (a merge made with GITHUB_TOKEN starts no workflow). It stays
#      open instead when `merge` is off or the accepted advisories changed
#      (DEC-051 needs a person), Package.swift changed beyond its version and
#      checksum, or rust/deny.toml changed. CI red: a draft pull request
#      with the failed run, and this job fails.
#
# Trust: the three checksums all come from the dreamail-openpgp release
# workflow, so they prove the files agree, not who made them. Running this
# workflow with `merge` on accepts that release without reading its diff
# (the pull request links it).
#
# Pull requests opened with GITHUB_TOKEN start no CI either, hence the
# manual CI runs. Needs "Allow GitHub Actions to create and approve pull
# requests" (Settings, Actions, General).
on:
  workflow_dispatch:
    inputs:
      version:
        description: "dreamail-openpgp release, e.g. 0.2.1 (empty: the newest)"
        required: false
        default: ""
      merge:
        description: "Merge the pull request when CI passes"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: integrate-openpgp
  cancel-in-progress: false

jobs:
  integrate:
    name: Integrate and check for regressions
    runs-on: ubuntu-24.04
    # CI with the UI shards takes about 25 minutes: up to twice, plus main's
    # run after the merge, which this job only starts.
    timeout-minutes: 90
    permissions:
      contents: write       # push the branch, merge
      pull-requests: write  # open and merge the pull request
      actions: write        # start CI on the branch and on main
    # GH_TOKEN is given only to the steps that call GitHub, never to the
    # one that reads the upstream repository's files.
    env:
      GH_REPO: ${{ github.repository }}
      BASE: ${{ github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      # The baseline: the same whole CI (UI shards included) green on main's
      # head, so that a red branch can only come from the new pin. A manual
      # run that already passed on that commit counts; otherwise one runs.
      - name: Run CI on main as the baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(git rev-parse HEAD)
          if ! run=$(.github/scripts/run-ci.sh --reuse "$BASE" "$sha"); then
            echo "CI is not green on $BASE ($sha)${run:+, run $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$run}: a failure on the branch could not be told from a regression. Fix $BASE first." | tee -a "$GITHUB_STEP_SUMMARY" >&2
            exit 1
          fi

      - name: Prepare the integration
        id: integrate
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$VERSION" ]; then
            python3 .github/scripts/integrate-openpgp.py "$VERSION"
          else
            python3 .github/scripts/integrate-openpgp.py
          fi

      - name: Push the branch and run CI on it
        id: ci
        if: steps.integrate.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.integrate.outputs.version }}
        run: |
          branch="deps/dreamail-openpgp-v$VERSION"
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code "$remote" "refs/heads/$branch" > /dev/null; then
            echo "Branch $branch already exists: a pull request for v$VERSION is open or was not cleaned up." >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -am "Integrate dreamail-openpgp v$VERSION" \
            -m "Made by the Integrate dreamail-openpgp workflow (.github/scripts/integrate-openpgp.py)."
          git push -q "$remote" "HEAD:refs/heads/$branch"
          sha=$(git rev-parse HEAD)
          {
            echo "branch=$branch"
            echo "sha=$sha"
          } >> "$GITHUB_OUTPUT"
          status=0
          run=$(.github/scripts/run-ci.sh "$branch" "$sha") || status=$?
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "passed=$([ "$status" -eq 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      # Also after a failed or timed-out step above, once the branch exists:
      # never a pushed branch without a pull request.
      - name: Open the pull request, merge if CI passed
        if: always() && steps.ci.outputs.branch != ''
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.integrate.outputs.version }}
          BRANCH: ${{ steps.ci.outputs.branch }}
          SHA: ${{ steps.ci.outputs.sha }}
          RUN: ${{ steps.ci.outputs.run }}
          PASSED: ${{ steps.ci.outputs.passed }}
          REVIEW: ${{ steps.integrate.outputs.review }}
          MERGE: ${{ inputs.merge }}
        run: |
          body=build/openpgp-integration.md
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$RUN"
          title="Integrate dreamail-openpgp v$VERSION"
          if [ -z "$RUN" ]; then
            printf '\n**CI could not be started or found on this branch** (%s/%s/actions/runs/%s). Not merged.\n' \
              "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" >> "$body"
            gh pr create --base "$BASE" --head "$BRANCH" --draft --title "$title" --body-file "$body"
            echo "CI did not run on $BRANCH: draft pull request opened, nothing merged." | tee -a "$GITHUB_STEP_SUMMARY" >&2
            exit 1
          fi
          if [ "$PASSED" != "true" ]; then
            printf '\n**CI failed on this branch** (%s), while it passed on main with the previous pin: the release introduces a regression. Not merged.\n' "$run_url" >> "$body"
            gh pr create --base "$BASE" --head "$BRANCH" --draft --title "$title" --body-file "$body"
            echo "CI failed on $BRANCH: draft pull request opened, nothing merged." | tee -a "$GITHUB_STEP_SUMMARY" >&2
            exit 1
          fi
          printf '\nCI passed on this branch: %s\n\nOpened by the Integrate dreamail-openpgp workflow (%s/%s/actions/runs/%s).\n' \
            "$run_url" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" >> "$body"
          gh pr create --base "$BASE" --head "$BRANCH" --title "$title" --body-file "$body"
          if [ "$REVIEW" = "true" ] || [ "$MERGE" != "true" ]; then
            echo "CI passed; pull request left open (review: $REVIEW, merge: $MERGE)." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # Only the commit CI tested: a push to the branch meanwhile fails this.
          gh pr merge "$BRANCH" --squash --delete-branch --match-head-commit "$SHA"
          gh workflow run ci.yml --ref "$BASE"
          echo "CI passed; v$VERSION merged into $BASE, and CI started there." | tee -a "$GITHUB_STEP_SUMMARY"

      # If even the pull request could not be opened, remove the branch, so
      # the next run is not refused because it exists.
      - name: Remove a branch left without a pull request
        if: failure() && steps.ci.outputs.branch != ''
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.ci.outputs.branch }}
        run: |
          if [ "$(gh pr list --head "$BRANCH" --state all --json number --jq length)" = "0" ]; then
            git push -q "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" --delete "$BRANCH"
            echo "Removed $BRANCH, which had no pull request." | tee -a "$GITHUB_STEP_SUMMARY"
          fi
